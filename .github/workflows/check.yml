name: Check checklist app

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm the app exists
        run: test -f src/index.html -a -f src/script.js -a -f src/styles.css

      - name: Guard against unsafe task rendering
        run: |
          if grep -RInE 'innerHTML|insertAdjacentHTML|document\.write' src; then
            echo "Unsafe DOM rendering API found."
            exit 1
          fi
